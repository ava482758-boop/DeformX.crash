name: Build DeformX IPA

on:
  push:
    branches: [ "main" ] # 每次推送到 main 分支就自动打包
  workflow_dispatch:      # 允许你在网页上手动点击按钮打包

jobs:
  build:
    runs-on: macos-15 # 使用最新的 macOS 环境，自带最新 Xcode

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 显示 Xcode 版本 (确认环境)
      run: xcodebuild -version

    - name: 3. 编译并打包 (未签名)
      run: |
        # 请确保这里的 DeformX 和你的 Xcode 工程 scheme 名字一致
        xcodebuild archive \
          -project DeformX.xcodeproj \
          -scheme DeformX \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath $RUNNER_TEMP/DeformX.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER=""

    - name: 4. 打包成 IPA 文件
      run: |
        mkdir -p $RUNNER_TEMP/Payload
        cp -r $RUNNER_TEMP/DeformX.xcarchive/Products/Applications/DeformX.app $RUNNER_TEMP/Payload/
        cd $RUNNER_TEMP
        zip -r DeformX.ipa Payload

    - name: 5. 上传 IPA 供下载
      uses: actions/upload-artifact@v4
      with:
        name: DeformX-Unsigned-IPA
        path: $RUNNER_TEMP/DeformX.ipa
